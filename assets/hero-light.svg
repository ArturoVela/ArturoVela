<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Arturo Vela — Backend and Full-Stack Developer</title>
  <desc id="desc">A light systems map connects a Next.js client to a Spring Boot API, Java service, and MySQL data layer.</desc>
  <defs>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#0969DA"/><stop offset=".58" stop-color="#8250DF"/><stop offset="1" stop-color="#1A7F37"/>
    </linearGradient>
    <style>
      @media (prefers-reduced-motion: no-preference) {
        .trace { stroke-dasharray: 7 7; animation: flow 3.2s linear infinite; }
        .status { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
      }
      @keyframes flow { to { stroke-dashoffset: -56; } }
      @keyframes pulse { 50% { opacity: .45; transform: scale(.72); } }
    </style>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#D0D7DE" stroke-width="1" opacity="0.34"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#0969DA"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1198" height="358" rx="24" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="358" rx="24" fill="url(#grid)"/>
  <rect x="24" y="1" width="1152" height="3" rx="1.5" fill="url(#accent)"/>
  <circle class="status" cx="54" cy="48" r="6" fill="#1A7F37"/>
