    <line class="trace" x1="550" y1="244" x2="594" y2="244" stroke="#8250DF" stroke-width="2" marker-end="url(#arrow)"/>
    <line class="trace" x1="826" y1="244" x2="870" y2="244" stroke="#1A7F37" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(54 202)">
