      <text x="18" y="59" fill="#24292F" font-size="21" font-weight="600">Next.js</text>
      <circle cx="194" cy="22" r="5" fill="#1A7F37"/>
    </g>
    <g transform="translate(330 202)">
      <rect width="220" height="84" rx="12" fill="#F6F8FA" stroke="#D0D7DE"/>
      <text x="18" y="28" fill="#57606A" font-size="13" letter-spacing="1.4">API</text>
      <text x="18" y="59" fill="#24292F" font-size="21" font-weight="600">Spring Boot</text>
      <circle cx="194" cy="22" r="5" fill="#1A7F37"/>
