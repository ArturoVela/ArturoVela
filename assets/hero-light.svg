  <text x="1146" y="54" fill="#1A7F37" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">FOCUS / BACKEND</text>
  <text x="54" y="126" fill="#24292F" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="52" font-weight="700" letter-spacing="-1">Arturo Vela</text>
  <text x="54" y="169" fill="url(#accent)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23" font-weight="600">Backend &amp; Full-Stack Developer</text>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
